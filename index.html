<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Repair Log</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <h1>Campus Repair Log</h1>
    <p>Report and track campus maintenance issues on Sepolia.</p>

    <button id="connectButton" type="button">Connect MetaMask</button>
    <p id="account">Wallet not connected</p>
    <p id="status" role="status"></p>

    <section>
      <h2>Report an issue</h2>
      <form id="ticketForm">
        <label for="title">Issue</label>
        <input id="title" name="title" required maxlength="80"
               placeholder="Broken corridor light">

        <label for="location">Location</label>
        <input id="location" name="location" required maxlength="80"
               placeholder="Library second floor">

        <button type="submit">Create ticket</button>
      </form>
    </section>

    <section>
      <h2>Tickets</h2>
      <button id="refreshButton" type="button">Refresh tickets</button>
      <div id="tickets"></div>
    </section>
  </main>
</body>
</html>
